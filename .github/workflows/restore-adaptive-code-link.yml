name: Restore Adaptive Code Link

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Restore codeurl
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('_publications/2025-06-20-llm-adaptive-learning.md')
          text = path.read_text()
          if not text.startswith('---\n'):
              raise SystemExit('Expected YAML front matter')

          _, frontmatter, body = text.split('---', 2)
          lines = frontmatter.splitlines()
          url = 'https://github.com/useveldafco/llm-adaptive-learning'

          if any(line.startswith('codeurl:') for line in lines):
              lines = [
                  f'codeurl: {url}' if line.startswith('codeurl:') else line
                  for line in lines
              ]
          else:
              lines.append(f'codeurl: {url}')

          path.write_text('---\n' + '\n'.join(lines) + '\n---' + body)
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _publications/2025-06-20-llm-adaptive-learning.md
          git commit -m "Restore adaptive learning code link"
          git push
