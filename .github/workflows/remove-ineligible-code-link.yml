name: Remove ineligible code link

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/remove-ineligible-code-link.yml

permissions:
  contents: write

jobs:
  remove-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true

      - name: Remove code link from newly accepted paper
        run: |
          sed -i '\#https://github.com/ScrewPostmanScrew/llm-adaptive-learning#d' \
            _publications/2025-06-20-llm-adaptive-learning.md

      - name: Commit correction and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-ineligible-code-link.yml
          git add _publications/2025-06-20-llm-adaptive-learning.md
          git commit -m "Limit code links to previously accepted papers"
          git push origin master
